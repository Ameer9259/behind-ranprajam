<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behind Ranprajam Burger</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--y:#FFCC00;--o:#F94D12;--ink:#2B1B12;--mut:#7a6a60;--line:#f0e6cf;--soft:#FFF8DC;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
aside{width:236px;background:var(--y);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-weight:800;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:11px}
aside button.nav{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500}
aside button.nav:hover{background:#ffffff66}
aside button.nav.on{background:var(--o);color:#fff;font-weight:700}
aside button:focus-visible,.btn:focus-visible,.chip:focus-visible,.cc:focus-visible,.pfb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{flex:1;padding:28px 32px;min-width:0;max-width:1200px}
h1{font-size:26px;margin:0 0 4px;font-weight:800}
.sub{color:var(--mut);margin:0 0 22px}
.btn{background:var(--o);color:#fff;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700}
.btn.alt{background:var(--y);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.6;cursor:wait}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.kpi{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi b{display:block;font-size:30px;color:var(--o);font-weight:800}
.kpi span{color:var(--mut);font-size:13px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.card h3{margin:0 0 10px;font-size:16px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.board{grid-template-columns:repeat(4,minmax(220px,1fr));overflow-x:auto;align-items:start}
.col{background:var(--soft);border-radius:14px;padding:10px;min-height:200px}
.col h4{margin:2px 4px 10px;display:flex;justify-content:space-between}
.col h4 i{font-style:normal;background:var(--y);border-radius:99px;padding:0 9px;font-size:13px}
.task{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.task:hover{border-color:var(--o)}
.task p{margin:0 0 6px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--soft);margin-right:4px}
.tag.hi{background:var(--o);color:#fff}.tag.late{background:#ffd9cc;color:#b02a00}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
.tw{overflow-x:auto}
label{font-size:12px;color:var(--mut);display:block}
input,select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--o)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--mut);font-size:12px}
.day{min-height:84px;border:1.5px solid var(--line);border-radius:10px;padding:4px;font-size:12px;overflow:hidden}
.day.today{border-color:var(--o);background:var(--soft)}
.ev{display:block;border-radius:6px;padding:1px 5px;margin-top:2px;background:var(--y);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.c{background:#ffb347}
.modal{position:fixed;inset:0;background:#2b1b1299;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;width:min(660px,100%);max-height:92vh;overflow:auto;padding:22px;border-top:8px solid var(--y)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cm{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.cm small{color:var(--mut)}
.ins{border-left:5px solid var(--o);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:199;max-width:340px}
canvas{max-height:280px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip.on{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #2b1b1233;vertical-align:middle}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.cc{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.cc:hover{border-color:var(--o)}
.ci{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;position:relative}
.ci img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px;display:grid;gap:6px;width:100%}
.cb b{font-size:16px}
.cb p{margin:0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cb small{color:var(--mut)}
.st{justify-self:start;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.pfd{font-size:12px;margin-right:10px;white-space:nowrap}
.pfb{display:inline-flex;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:500}
.pfb.on{border-color:var(--o);background:var(--soft);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin-top:6px}
.podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,300px));gap:16px;align-items:start}
.cc.first{border:3px solid var(--o);background:var(--soft)}
.rk{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:var(--y);color:var(--ink);border:2px solid #fff}
.cc.first .rk{background:var(--o);color:#fff;width:48px;height:48px;font-size:24px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.mets div{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 2px}
.mets b{display:block;font-size:16px;color:var(--o)}.mets span{font-size:11px;color:var(--mut)}
#auth{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.authbox{width:min(420px,100%);border:1.5px solid var(--line);border-top:8px solid var(--y);border-radius:18px;padding:26px}
.authbox h1{font-size:22px;margin:10px 0 2px}
.tabs{display:flex;gap:6px;margin:0 0 14px}.tabs button{flex:1}
.ubox{margin-top:auto;border-top:1.5px solid #00000022;padding-top:12px;font-size:13px}
.ubox b{display:block}
.badge{display:inline-block;background:var(--o);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;margin-left:4px}
.ok{color:#1d7a46!important}
.link{background:none;border:0;color:var(--o);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}.brand{width:100%;margin:0}main{padding:18px}}
.cc.sm .ci{aspect-ratio:16/10;font-size:30px}
.cc.sm .cb{padding:9px 10px;gap:5px}
.cc.sm .cb b{font-size:14px;line-height:1.25}
.cc.sm .cb p{font-size:12px;-webkit-line-clamp:2}
.row.tags{gap:4px}
.mrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.mrow .chip{white-space:nowrap;padding:4px 12px;font-size:13px}
.pic{display:inline-flex;gap:4px;align-items:center}
.pic svg{display:block;border-radius:6px}
.tt{font-size:11px;padding:1px 8px;border-radius:99px;background:#fff;border:1.5px solid var(--y);white-space:nowrap}
.row select{width:auto}
.cm .rv{background:var(--o);color:#fff;border-radius:99px;font-size:10px;padding:0 7px;margin-left:6px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:12px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.ev[style]{font-weight:500}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <span id="brandLogo"></span>
    <div>Behind<small>Ranprajam Burger</small></div>
  </div>
  <button class="nav on" data-v="dash">ภาพรวมคอนเทนต์</button>
  <button class="nav" data-v="board">บอร์ดงาน</button>
  <button class="nav" data-v="cal">ตารางคอนเทนต์</button>
  <button class="nav" data-v="review">ตรวจงาน</button>
  <button class="nav" data-v="feedback">ผลตอบรับ</button>
  <button class="nav" data-v="ins">ข้อมูลเชิงลึก</button>
  <button class="nav" data-v="admin" id="navAdmin" style="display:none">จัดการผู้ใช้<span id="pend"></span></button>
  <div class="ubox" id="ubox"></div>
</aside>
<main id="app"></main>
<div id="auth"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ ตั้งค่า Supabase ============ */
const SUPABASE_URL='https://pfpgecavzrrbathvdimg.supabase.co';
const SUPABASE_KEY='sb_publishable_1T8cxx8qFEPQnlWcHKh_IA_s9-H9jZ2';

/* ============ ปรับแต่งหน้าตา ============ */
const LOGO_URL='Ranprajam bg logo.png';        // ชื่อไฟล์โลโก้ เช่น 'logo.png' (อัปโหลดไว้ใน repo ข้าง index.html) เว้นว่างเพื่อใช้โลโก้เดิม
const PLACEHOLDER='Ranprajam bg logo.png';   // สัญลักษณ์ที่แสดงเมื่อคอนเทนต์ยังไม่มีรูป
/* ================================================================ */

const ST=[['todo','รอทำ'],['doing','กำลังทำ'],['review','รอตรวจ'],['done','เสร็จแล้ว']];
const CT=[['idea','ไอเดีย','#e9e2cf'],['draft','ร่างแคปชัน','#ffe066'],['shoot','กำลังผลิต','#ffb347'],['review','รอตรวจ','#ff8a3d'],['ready','พร้อมโพสต์','#F94D12'],['posted','โพสต์แล้ว','#2e9e5b']];
const PF=['Facebook','Instagram','TikTok'];
const PC={Facebook:'#1877F2',Instagram:'#E1306C',TikTok:'#111111'};
const DW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TABLES=['contents','tasks'];
const td=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const configured=!/YOUR-/.test(SUPABASE_URL+SUPABASE_KEY);
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let S={contents:[],tasks:[]},PR=[],ME=null,view='dash',calM=new Date(),charts=[],cf='all',mv='all',tpf='all',tpv='all',fsel=null,fTmp={},pfv='all',hpf='all',tm='eng',tmpImg='',tmpPfs=[],chan=null,tmr=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const isAdmin=()=>!!ME&&ME.role==='admin';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const prog=t=>t.chk.length?Math.round(t.chk.filter(c=>c.d).length/t.chk.length*100):(t.status==='done'?100:0);
const late=t=>t.status!=='done'&&t.due&&t.due<td();
const fmt=n=>Number(n).toLocaleString('th-TH');
const short=t=>t.length>14?t.slice(0,13)+'…':t;

/* ===== โลโก้ ===== */
const logoSvg=(bg,z)=>`<svg width="${z}" height="${z}" viewBox="0 0 42 42" aria-hidden="true"><rect width="42" height="42" rx="10" fill="${bg}"/><path d="M21 6C12 6 8 13 7 19h14z" fill="#F94D12"/><rect x="8" y="22" width="13" height="6" rx="2" fill="#F94D12"/><path d="M9 31l12 4v1C14 36 9 34 9 31z" fill="#F94D12"/></svg>`;
const logoHTML=(z,bg)=>LOGO_URL?`<img src="${esc(LOGO_URL)}" width="${z}" height="${z}" alt="โลโก้ Behind Ranprajam Burger" style="display:block;border-radius:10px;object-fit:cover">`:logoSvg(bg,z);

/* ===== ประเภทคอนเทนต์ และไอคอนแพลตฟอร์ม ===== */
const CTY=[['case','เล่าเคส'],['fun','อินเตอร์เทน'],['bts','เบื้องหลัง'],['qa','ตอบคำถาม'],['edu','สอน'],['sell','ขายของ']];
const tyName=k=>(CTY.find(x=>x[0]===k)||['',''])[1];
const TYC={case:'#6C4AB6',fun:'#D6285F',bts:'#0B7A7A',qa:'#1F6FBF',edu:'#1F8A4C',sell:'#E0420D'};
const tyColor=k=>TYC[k]||'#7a6a60';
const ttag=k=>`<span class="tt" style="background:${tyColor(k)};border-color:${tyColor(k)};color:#fff">${tyName(k)}</span>`;
const GL={Facebook:'<path d="M15.6 8H14c-.8 0-1 .4-1 1v1.6h2.5l-.4 2.6H13V20h-2.9v-6.8H8v-2.6h2.1V8.9C10.1 6.9 11.3 6 13.1 6h2.5z" fill="#fff"/>',
Instagram:'<rect x="6" y="6" width="12" height="12" rx="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="2.9" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16" cy="8" r="1" fill="#fff"/>',
TikTok:'<path d="M13.2 6v8.1a2.3 2.3 0 1 1-2-2.3M13.2 6c.3 2 1.6 3.3 3.6 3.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>'};
const ic=(p,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" role="img" aria-label="${p}"><title>${p}</title><rect width="24" height="24" rx="6" fill="${PC[p]}"/>${GL[p]}</svg>`;
const pfIcons=c=>c.pfs.length?`<span class="pic">${c.pfs.map(p=>ic(p,20)).join('')}</span>`:'<small>ยังไม่เลือกแพลตฟอร์ม</small>';

/* ===== ตัวช่วยคำนวณผลตอบรับ (แยกตามแพลตฟอร์มและประเภท) ===== */
const num=v=>+v||0;
const engOf=s=>num(s.likes)+num(s.cmt)+num(s.shr);
const rateOf=s=>num(s.reach)?engOf(s)/num(s.reach)*100:0;
function entries(pf='all',tp='all'){const o=[];S.contents.forEach(c=>{if(tp!=='all'&&c.type!==tp)return;PF.forEach(p=>{const s=c.stats[p];if((pf==='all'||pf===p)&&s&&(num(s.reach)||engOf(s)||num(s.clk)))o.push({c,pf:p,s})})});return o}
function agg(list){const t={reach:0,likes:0,cmt:0,shr:0,clk:0};list.forEach(e=>{for(const k in t)t[k]+=num(e.s[k])});t.eng=t.likes+t.cmt+t.shr;t.rate=t.reach?t.eng/t.reach*100:0;return t}
function pfTabs(){return`<div class="row" style="margin-bottom:16px"><button class="chip ${pfv==='all'?'on':''}" onclick="pfv='all';render()">ทุกแพลตฟอร์ม</button>${PF.map(p=>`<button class="chip ${pfv===p?'on':''}" onclick="pfv='${p}';render()"><span class="pic" style="vertical-align:middle">${ic(p,16)}</span> ${p}</button>`).join('')}<select aria-label="ประเภทคอนเทนต์" style="margin-left:auto" onchange="tpv=this.value;render()"><option value="all">ทุกประเภท</option>${CTY.map(([k,l])=>`<option value="${k}" ${tpv===k?'selected':''}>${l}</option>`).join('')}</select></div>`}

/* ============ ชั้นข้อมูล (Supabase) ============ */
async function loadAll(){
 const rs=await Promise.all(TABLES.map(t=>sb.from(t).select('id,data').order('id')));
 rs.forEach((r,i)=>{if(r.error)toast('โหลดข้อมูลไม่สำเร็จ: '+r.error.message);else S[TABLES[i]]=r.data.map(x=>{const o={...x.data,id:x.id};
  if(TABLES[i]==='contents'){o.pfs=(o.pfs||(o.pf?[o.pf]:[])).filter(p=>PF.includes(p));o.stats=o.stats||{};o.cm=o.cm||[];o.type=o.type||''}return o})});
 if(isAdmin()){const r=await sb.from('profiles').select('*').order('created_at');if(!r.error)PR=r.data}
}
async function put(t,o){const {id,...d}=o;let r;
 if(id)r=await sb.from(t).update({data:d}).eq('id',id).select('id');
 else r=await sb.from(t).insert({data:d}).select('id').single();
 if(r.error){toast('บันทึกไม่สำเร็จ: '+r.error.message);return false}
 if(id&&!r.data.length){toast('ไม่มีสิทธิ์แก้ไขรายการนี้ หรือรายการถูกลบไปแล้ว');return false}
 if(!id)o.id=r.data.id;return true}
async function del(t,id){const r=await sb.from(t).delete().eq('id',id).select('id');
 if(r.error||!r.data.length){toast('ลบไม่สำเร็จ (เฉพาะแอดมินที่ลบได้)');return false}return true}
async function commit(t,o,after){if(await put(t,o)){await loadAll();render();if(after)after()}}
function onChange(){clearTimeout(tmr);tmr=setTimeout(async()=>{await loadAll();pendBadge();const a=document.activeElement;if(a&&$('#app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()},500)}

/* ============ UI พื้นฐาน ============ */
document.querySelectorAll('aside .nav').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('aside .nav').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
const closeM=()=>$('#modal').classList.remove('on');
const openM=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('on')};
function render(){if(!ME)return;if(view==='admin'&&!isAdmin())view='dash';charts.forEach(c=>c.destroy());charts=[];const v={dash,board,cal,review,feedback,ins,admin}[view];$('#app').innerHTML=v();if(window['after_'+view])window['after_'+view]()}
function head(t,s,act=''){return`<div class="row" style="justify-content:space-between"><div><h1>${t}</h1><p class="sub">${s}</p></div>${act}</div>`}

/* ============ หน้าแรก: ภาพรวมคอนเทนต์ ============ */
const stOf=k=>CT.find(x=>x[0]===k)||CT[0];
const monthKey=c=>c.date?c.date.slice(0,7):'none';
const mLabel=k=>new Date(k+'-01').toLocaleDateString('th-TH',{month:'short',year:'2-digit'});
const nowStr=()=>new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
function cCard(c){const [,l,col]=stOf(c.status);
 return`<button class="cc sm" onclick="openContent(${c.id})"><div class="ci">${c.img?`<img src="${c.img}" alt="">`:PLACEHOLDER}</div><div class="cb"><div class="row tags"><span class="st" style="background:${col};color:${['review','ready','posted'].includes(c.status)?'#fff':'var(--ink)'}">${l}</span>${c.type?`${ttag(c.type)}`:''}</div><b>${esc(c.title)}</b><p>${esc(c.cap)||'ยังไม่มีแคปชัน'}</p><div class="row" style="justify-content:space-between">${pfIcons(c)}<small>${c.date?c.date.slice(8)+'/'+c.date.slice(5,7):'ไม่กำหนดวัน'}${c.cm.length?`, ${c.cm.length} คอมเมนต์`:''}</small></div></div></button>`}
function dash(){
 const cur=td().slice(0,7),ms=[...new Set(S.contents.filter(c=>c.date).map(monthKey).concat(cur))].sort(),none=S.contents.filter(c=>!c.date).length;
 const cnt=k=>S.contents.filter(c=>monthKey(c)===k).length;
 const C=S.contents.filter(c=>(mv==='all'||monthKey(c)===mv)&&(cf==='all'||c.status===cf)&&(tpf==='all'||c.type===tpf)).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
 const T=S.tasks,done=T.filter(t=>t.status==='done').length;
 return head('Behind Ranprajam Burger','ภาพรวมคอนเทนต์ทั้งหมด เลือกดูทีละเดือน กดที่การ์ดเพื่อดูหรือแก้ไข',`<button class="btn" onclick="openContent()">+ เพิ่มคอนเทนต์</button>`)+
 `<div class="mrow" role="group" aria-label="เลือกเดือน"><button class="chip ${mv==='all'?'on':''}" onclick="mv='all';render()">ทุกเดือน ${S.contents.length}</button>${ms.map(k=>`<button class="chip ${mv===k?'on':''}" onclick="mv='${k}';render()">${mLabel(k)} ${cnt(k)}</button>`).join('')}${none?`<button class="chip ${mv==='none'?'on':''}" onclick="mv='none';render()">ไม่กำหนดวัน ${none}</button>`:''}</div>
 <div class="row" style="margin-bottom:14px"><select aria-label="ประเภทคอนเทนต์" onchange="tpf=this.value;render()"><option value="all">ทุกประเภท</option>${CTY.map(([k,l])=>`<option value="${k}" ${tpf===k?'selected':''}>${l}</option>`).join('')}</select><select aria-label="สถานะคอนเทนต์" onchange="cf=this.value;render()"><option value="all">ทุกสถานะ</option>${CT.map(([k,l])=>`<option value="${k}" ${cf===k?'selected':''}>${l}</option>`).join('')}</select><span class="sub" style="margin:0">แสดง ${C.length} จาก ${S.contents.length} รายการ</span></div>
 <div class="cgrid">${C.map(cCard).join('')||'<div class="card"><p class="sub" style="margin:0">ไม่มีคอนเทนต์ตามตัวกรองนี้ กด "+ เพิ่มคอนเทนต์" เพื่อเริ่มวางไอเดีย</p></div>'}</div>
 ${popular()}
 <div class="card" style="margin-top:28px"><h3>สถานะคอนเทนต์</h3><div class="row" style="gap:24px;align-items:center"><div style="width:230px;max-width:100%"><canvas id="c1"></canvas></div><div class="row" style="flex:1;min-width:220px">${CT.map(([k,l,col])=>`<button class="chip" onclick="goStatus('${k}')"><i class="dot" style="background:${col}"></i>${l} ${S.contents.filter(c=>c.status===k).length}</button>`).join('')}</div></div></div>
 <h2 style="margin:28px 0 12px">สรุปงาน</h2>
 <div class="grid kpis"><div class="kpi"><b>${T.length-done}</b><span>งานที่ยังไม่เสร็จ</span></div>
 <div class="kpi"><b>${T.filter(late).length}</b><span>งานเลยกำหนด</span></div>
 <div class="kpi"><b>${S.contents.filter(c=>c.status==='ready').length}</b><span>คอนเทนต์พร้อมโพสต์</span></div>
 </div>`}
window.after_dash=()=>{charts.push(new Chart($('#c1'),{type:'doughnut',data:{labels:CT.map(x=>x[1]),datasets:[{data:CT.map(([k])=>S.contents.filter(c=>c.status===k).length),backgroundColor:CT.map(x=>x[2])}]},options:{plugins:{legend:{display:false}}}}))};
function goStatus(k){cf=k;mv='all';tpf='all';view='dash';document.querySelectorAll('aside .nav').forEach(x=>x.classList.toggle('on',x.dataset.v==='dash'));render()}

/* ===== การ์ดคอนเทนต์ ===== */
function prevImg(){$('#c_prev').innerHTML=tmpImg?`<img src="${tmpImg}" alt="">`:PLACEHOLDER}
function pickImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL('image/jpeg',.72);prevImg()};im.onerror=()=>toast('เปิดรูปนี้ไม่ได้');im.src=r.result};r.readAsDataURL(f)}
function drawPf(){$('#c_pfs').innerHTML=PF.map(p=>{const on=tmpPfs.includes(p);return`<button type="button" class="pfb ${on?'on':''}" aria-pressed="${on}" onclick="togglePf('${p}')">${ic(p,22)}<span style="margin:0 8px 0 7px">${p}</span>${on?'✓':''}</button>`}).join('')}
function togglePf(p){tmpPfs=PF.filter(x=>x===p?!tmpPfs.includes(p):tmpPfs.includes(x));drawPf()}
function collect(c){const v=i=>$('#'+i).value;Object.assign(c,{title:v('c_t'),cap:v('c_c'),note:v('c_n'),type:v('c_ty'),pfs:tmpPfs,date:v('c_d'),status:v('c_s'),img:tmpImg});delete c.pf;return c}
function openContent(id,pre){
 const c=S.contents.find(x=>x.id===id)||{id:0,title:'',cap:'',img:'',type:'',pfs:[],stats:{},cm:[],date:'',status:pre||'idea',note:''};
 tmpImg=c.img||'';tmpPfs=[...c.pfs];
 openM(`<h2 style="margin-top:0">${id?'แก้ไขคอนเทนต์':'เพิ่มคอนเทนต์ใหม่'}</h2><div class="grid" style="gap:10px">
 <div><label>ชื่อคอนเทนต์</label><input id="c_t" value="${esc(c.title)}"></div>
 <div><label>รูปตัวอย่าง</label><div id="c_prev" class="ci" style="aspect-ratio:auto;height:190px;border-radius:12px"></div>
 <div class="row" style="margin-top:6px"><label class="btn sm ghost" style="cursor:pointer;margin:0">เลือกรูป<input type="file" accept="image/*" style="display:none" onchange="pickImg(this)"></label><button class="btn sm ghost" onclick="tmpImg='';prevImg()">ลบรูป</button></div></div>
 <div><label>แคปชัน</label><textarea id="c_c" rows="4">${esc(c.cap)}</textarea></div>
 <div><label>ไอเดีย / โน้ตเพิ่มเติม</label><textarea id="c_n" rows="2">${esc(c.note)}</textarea></div>
 <div><label>โพสต์ลงแพลตฟอร์ม (เลือกได้หลายรายการ)</label><div class="row" id="c_pfs" style="margin-top:4px"></div></div>
 <div class="row"><div style="flex:1;min-width:140px"><label>ประเภทคอนเทนต์</label><select id="c_ty" style="width:100%"><option value="">ยังไม่ระบุ</option>${CTY.map(([k,l])=>`<option value="${k}" ${c.type===k?'selected':''}>${l}</option>`).join('')}</select></div>
 <div style="flex:1;min-width:140px"><label>วันที่โพสต์ (ไม่บังคับ)</label><input type="date" id="c_d" value="${c.date}"></div>
 <div style="flex:1;min-width:140px"><label>สถานะ</label><select id="c_s" style="width:100%">${CT.map(([k,l])=>`<option value="${k}" ${c.status===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
 ${id?`<div><label>คอมเมนต์ (${c.cm.length})</label>${c.cm.map(m=>`<div class="cm"><small>${esc(m.a)}${m.r==='admin'?'<span class="rv">ผู้ตรวจ</span>':''}, ${esc(m.ts)}</small><br>${esc(m.t)}</div>`).join('')||'<p class="sub" style="margin:4px 0 8px">ยังไม่มีคอมเมนต์</p>'}<div class="row"><input id="cc_t" placeholder="เขียนคอมเมนต์ในชื่อ ${esc(ME.name)}" style="flex:1"><button class="btn sm" onclick="addCCm(${id})">ส่ง</button></div></div>`:'<p class="sub" style="margin:0">บันทึกคอนเทนต์ก่อน แล้วจะคอมเมนต์ได้ ส่วนผลตอบรับกรอกที่เมนู "ผลตอบรับ" หลังเปลี่ยนสถานะเป็นโพสต์แล้ว</p>'}
 <div class="row" style="justify-content:space-between"><div>${id&&isAdmin()?`<button class="btn ghost" onclick="delContent(${id})">ลบ</button>`:''}</div><div class="row"><button class="btn ghost" onclick="closeM()">ปิด</button><button class="btn" onclick="saveContent(${id})">บันทึก</button></div></div></div>`);prevImg();drawPf()}
async function saveContent(id){if(!$('#c_t').value.trim())return toast('กรุณาใส่ชื่อคอนเทนต์');
 const c=S.contents.find(x=>x.id===id)||{cm:[],stats:{}};collect(c);
 if(await put('contents',c)){closeM();await loadAll();render();toast('บันทึกคอนเทนต์แล้ว')}}
function addCCm(id){const x=$('#cc_t').value.trim();if(!x)return;const c=S.contents.find(y=>y.id===id);collect(c);
 c.cm.push({a:ME.name,r:ME.role,t:x,ts:nowStr()});commit('contents',c,()=>openContent(id))}
async function delContent(id){if(!isAdmin()||!confirm('ลบคอนเทนต์นี้?'))return;if(await del('contents',id)){closeM();await loadAll();render()}}

/* ============ บอร์ดงาน ============ */
function taskCard(t){return`<div class="task" onclick="openTask(${t.id})"><p>${esc(t.title)}</p><span class="tag ${t.pri==='high'?'hi':''}">${{high:'ด่วน',mid:'ปกติ',low:'ไม่รีบ'}[t.pri]}</span><span class="tag">${esc(t.who||'-')}</span>${t.due?`<span class="tag ${late(t)?'late':''}">${t.due}</span>`:''}<div class="bar"><i style="width:${prog(t)}%"></i></div></div>`}
function board(){return head('บอร์ดงาน','ติดตามสถานะงานตั้งแต่เริ่มจนเสร็จ',`<button class="btn" onclick="openTask()">+ เพิ่มงาน</button>`)+
 `<div class="grid board">${ST.map(([k,l])=>{const L=S.tasks.filter(t=>t.status===k);return`<div class="col"><h4>${l}<i>${L.length}</i></h4>${L.map(taskCard).join('')}</div>`}).join('')}</div>`}
function openTask(id){
 const t=S.tasks.find(x=>x.id===id)||{id:0,title:'',desc:'',who:ME?ME.name:'',due:td(3),status:'todo',pri:'mid',chk:[],cm:[]};
 openM(`<h2 style="margin-top:0">${id?'รายละเอียดงาน':'เพิ่มงานใหม่'}</h2>
 <div class="grid" style="gap:10px">
 <div><label>ชื่องาน</label><input id="t_title" value="${esc(t.title)}"></div>
 <div><label>รายละเอียด</label><textarea id="t_desc" rows="2">${esc(t.desc)}</textarea></div>
 <div class="row"><div style="flex:1"><label>ผู้รับผิดชอบ</label><input id="t_who" value="${esc(t.who)}"></div>
 <div style="flex:1"><label>กำหนดส่ง</label><input type="date" id="t_due" value="${t.due}"></div></div>
 <div class="row"><div style="flex:1"><label>สถานะ</label><select id="t_st">${ST.map(([k,l])=>`<option value="${k}" ${t.status===k?'selected':''}>${l}</option>`).join('')}</select></div>
 <div style="flex:1"><label>ความสำคัญ</label><select id="t_pri">${[['high','ด่วน'],['mid','ปกติ'],['low','ไม่รีบ']].map(([k,l])=>`<option value="${k}" ${t.pri===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
 <div><label>เช็คลิสต์ (${prog(t)}%)</label><div>${t.chk.map((c,i)=>`<div class="row"><input type="checkbox" style="width:auto" ${c.d?'checked':''} onchange="tk(${t.id},${i},this.checked)"><span>${esc(c.t)}</span></div>`).join('')}</div>
 ${id?`<div class="row" style="margin-top:6px"><input id="newchk" placeholder="เพิ่มรายการเช็ค" style="flex:1"><button class="btn sm alt" onclick="addChk(${id})">เพิ่ม</button></div>`:'<p class="sub">บันทึกงานก่อน แล้วค่อยเพิ่มเช็คลิสต์และคอมเมนต์ได้</p>'}</div>
 ${id?`<div><label>คอมเมนต์</label>${t.cm.map(c=>`<div class="cm"><small>${esc(c.a)}, ${c.ts}</small><br>${esc(c.t)}</div>`).join('')||'<p class="sub">ยังไม่มีคอมเมนต์</p>'}
 <div class="row"><input id="cm_t" placeholder="เขียนคอมเมนต์ในชื่อ ${esc(ME.name)}" style="flex:1"><button class="btn sm" onclick="addCm(${id})">ส่ง</button></div></div>`:''}
 <div class="row" style="justify-content:space-between"><div>${id&&isAdmin()?`<button class="btn ghost" onclick="delTask(${id})">ลบงาน</button>`:''}</div><div class="row"><button class="btn ghost" onclick="closeM()">ปิด</button><button class="btn" onclick="saveTask(${id})">บันทึก</button></div></div></div>`)}
async function saveTask(id){
 const v=i=>$('#'+i).value;if(!v('t_title').trim())return toast('กรุณาใส่ชื่องาน');
 const t=S.tasks.find(x=>x.id===id)||{chk:[],cm:[]};
 Object.assign(t,{title:v('t_title'),desc:v('t_desc'),who:v('t_who'),due:v('t_due'),status:v('t_st'),pri:v('t_pri')});
 if(await put('tasks',t)){closeM();await loadAll();render();toast('บันทึกงานแล้ว')}}
async function delTask(id){if(!isAdmin()||!confirm('ลบงานนี้?'))return;if(await del('tasks',id)){closeM();await loadAll();render()}}
function tk(id,i,d){const t=S.tasks.find(x=>x.id===id);t.chk[i].d=d?1:0;commit('tasks',t,()=>openTask(id))}
function addChk(id){const v=$('#newchk').value.trim();if(!v)return;const t=S.tasks.find(x=>x.id===id);t.chk.push({t:v,d:0});commit('tasks',t,()=>openTask(id))}
function addCm(id){const x=$('#cm_t').value.trim();if(!x)return;const t=S.tasks.find(y=>y.id===id);t.cm.push({a:ME.name,t:x,ts:td()});commit('tasks',t,()=>openTask(id))}

/* ============ ตารางคอนเทนต์ ============ */
function cal(){
 const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let cells=['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
 for(let d=1;d<=n;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  cells+=`<div class="day ${ds===td()?'today':''}"><b>${d}</b>${S.contents.filter(c=>c.date===ds).map(c=>`<span class="ev" style="background:${tyColor(c.type)};color:#fff" title="${esc((tyName(c.type)||'ยังไม่ระบุประเภท')+(c.pfs.length?': '+c.pfs.join(', '):''))}" onclick="openContent(${c.id})">${esc(c.title)}</span>`).join('')}${S.tasks.filter(t=>t.due===ds).map(t=>`<span class="ev" onclick="openTask(${t.id})">${esc(t.title)}</span>`).join('')}</div>`}
 return head('ตารางคอนเทนต์',`${calM.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}`,`<div class="row"><button class="btn ghost" onclick="calM.setMonth(calM.getMonth()-1);render()">ก่อนหน้า</button><button class="btn ghost" onclick="calM=new Date();render()">วันนี้</button><button class="btn ghost" onclick="calM.setMonth(calM.getMonth()+1);render()">ถัดไป</button></div>`)+`<div class="row" style="margin-bottom:12px" role="group" aria-label="คำอธิบายสี">${CTY.map(([k,l])=>`<span class="lg"><i class="sw" style="background:${TYC[k]}"></i>${l}</span>`).join('')}<span class="lg"><i class="sw" style="background:#7a6a60"></i>ยังไม่ระบุประเภท</span><span class="lg"><i class="sw" style="background:#FFCC00"></i>กำหนดส่งงาน</span></div><div class="cal">${cells}</div>`}

/* ============ ตรวจงาน (แอดมิน/ผู้ตรวจ) ============ */
function review(){
 const adm=isAdmin(),L=S.tasks.filter(t=>t.status==='review'),C=S.contents.filter(c=>c.status==='review');
 return head('ตรวจงาน',adm?'คอนเทนต์ที่ตัดต่อเสร็จแล้วและงานที่รอผู้ตรวจ คอมเมนต์ถึงทีมได้ก่อนกดผ่านหรือส่งกลับ':'คอนเทนต์ที่ตัดต่อเสร็จแล้วและรอผู้ตรวจ ส่งตรวจได้เลยโดยไม่ต้องกำหนดวันโพสต์',`<button class="btn" onclick="openContent(0,'review')">+ ส่งคอนเทนต์เข้าตรวจ</button>`)+
 `<h3>คอนเทนต์รอตรวจ (${C.length})</h3>`+
 (C.length?`<div class="grid" style="gap:12px;margin-bottom:24px">${C.map(c=>`<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px">
 <div class="ci" style="width:110px;flex-shrink:0;border-radius:12px;aspect-ratio:1;font-size:32px">${c.img?`<img src="${c.img}" alt="">`:PLACEHOLDER}</div>
 <div style="flex:1;min-width:0"><div class="row tags" style="margin-bottom:6px">${c.type?ttag(c.type):''}<span class="tag">${c.date?'โพสต์ '+c.date:'ยังไม่กำหนดวันโพสต์'}</span></div>
 <h3 style="margin:0 0 6px">${esc(c.title)}</h3>${pfIcons(c)}<p style="margin:8px 0 0">${esc(c.cap)||'<span class="sub">ยังไม่มีแคปชัน</span>'}</p></div></div>
 ${c.cm.slice(-2).map(m=>`<div class="cm"><small>${esc(m.a)}${m.r==='admin'?'<span class="rv">ผู้ตรวจ</span>':''}, ${esc(m.ts)}</small><br>${esc(m.t)}</div>`).join('')}
 ${adm?`<input id="rc${c.id}" placeholder="คอมเมนต์ถึงทีม (ไม่บังคับ)" style="margin:8px 0"><div class="row"><button class="btn" onclick="rvContent(${c.id},1)">ผ่าน (พร้อมโพสต์)</button><button class="btn alt" onclick="rvContent(${c.id},0)">ส่งกลับแก้ไข</button><button class="btn ghost" onclick="openContent(${c.id})">เปิดดู</button></div>`:`<div class="row" style="margin-top:8px"><button class="btn ghost" onclick="openContent(${c.id})">เปิดดูและคอมเมนต์</button></div>`}</div>`).join('')}</div>`:'<div class="card" style="margin-bottom:24px"><p class="sub" style="margin:0">ยังไม่มีคอนเทนต์รอตรวจ กด "+ ส่งคอนเทนต์เข้าตรวจ" หรือเปลี่ยนสถานะที่การ์ดคอนเทนต์เป็น "รอตรวจ"</p></div>')+
 `<h3>งานรอตรวจ (${L.length})</h3>`+
 (L.length?L.map(t=>`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(t.title)}</h3><span class="tag">${esc(t.who)}</span></div>
 <p>${esc(t.desc)||'<span class="sub">ไม่มีรายละเอียด</span>'}</p><p class="sub" style="margin:0 0 8px">เช็คลิสต์ ${prog(t)}% และ ${t.cm.length} คอมเมนต์</p>
 ${adm?`<input id="rn${t.id}" placeholder="บันทึกผลการตรวจ / ข้อแก้ไข" style="margin-bottom:8px"><div class="row"><button class="btn" onclick="doReview(${t.id},1)">ผ่าน</button><button class="btn alt" onclick="doReview(${t.id},0)">ขอแก้ไข</button><button class="btn ghost" onclick="openTask(${t.id})">เปิดงาน</button></div>`:`<button class="btn ghost" onclick="openTask(${t.id})">เปิดงาน</button>`}</div>`).join(''):'<div class="card"><p class="sub" style="margin:0">ไม่มีงานรอตรวจ</p></div>')}
function rvContent(id,ok){if(!isAdmin())return;const c=S.contents.find(x=>x.id===id),n=$('#rc'+id).value.trim();
 c.status=ok?'ready':'draft';if(n)c.cm.push({a:ME.name,r:ME.role,t:(ok?'ผ่าน: ':'ขอแก้ไข: ')+n,ts:nowStr()});
 commit('contents',c,()=>toast(ok?'อนุมัติคอนเทนต์แล้ว':'ส่งกลับให้แก้ไขแล้ว'))}
function doReview(id,ok){if(!isAdmin())return;const t=S.tasks.find(x=>x.id===id),n=$('#rn'+id).value;
 t.status=ok?'done':'doing';if(n)t.cm.push({a:ME.name,t:(ok?'ผ่าน: ':'ขอแก้ไข: ')+n,ts:td()});

/* ============ ผลตอบรับ: เลือกโปรเจกต์จาก dropdown แล้วกรอกทั้ง 3 แพลตฟอร์ม ============ */
function fPick(v){fsel=v?+v:null;drawFb()}
function setFb(p,k,v){(fTmp[p]=fTmp[p]||{})[k]=num(v)}
function drawFb(){const box=$('#f_form');if(!box)return;const c=S.contents.find(x=>x.id===fsel);if(!c){box.innerHTML='';return}
 fTmp=JSON.parse(JSON.stringify(c.stats||{}));
 box.innerHTML=`<div class="grid" style="gap:10px;margin-top:12px">${PF.map(p=>{const s=fTmp[p]||{};return`<div class="card" style="padding:10px"><b style="display:flex;align-items:center;gap:8px">${ic(p,22)}${p}</b><div class="statgrid">${[['reach','Reach'],['likes','ไลก์'],['cmt','คอมเมนต์'],['shr','แชร์'],['clk','คลิก']].map(([k,l])=>`<div><label>${l}</label><input type="number" min="0" value="${num(s[k])||''}" oninput="setFb('${p}','${k}',this.value)"></div>`).join('')}</div></div>`}).join('')}
 <div class="row"><button class="btn" onclick="saveFb()">บันทึกผลตอบรับ</button><span class="sub" style="margin:0">กรอกเฉพาะแพลตฟอร์มที่โพสต์ เว้นว่างได้</span></div></div>`}
async function saveFb(){const c=S.contents.find(x=>x.id===fsel);if(!c)return;
 c.stats=fTmp;PF.forEach(p=>{const s=fTmp[p];if(s&&(num(s.reach)||engOf(s)||num(s.clk))&&!c.pfs.includes(p))c.pfs.push(p)});c.pfs=PF.filter(p=>c.pfs.includes(p));
 if(await put('contents',c)){fsel=null;await loadAll();render();toast('บันทึกผลตอบรับแล้ว')}}

 (miss?`<div class="ins">มี ${miss} คอนเทนต์ที่โพสต์แล้วแต่ยังไม่ได้กรอกผลตอบรับ</div>`:'')+pfTabs()+
 `<div class="grid kpis"><div class="kpi"><b>${fmt(A.reach)}</b><span>Reach รวม</span></div><div class="kpi"><b>${fmt(A.eng)}</b><span>ปฏิสัมพันธ์รวม (ไลก์ คอมเมนต์ แชร์)</span></div><div class="kpi"><b>${A.rate.toFixed(1)}%</b><span>Engagement rate</span></div><div class="kpi"><b>${fmt(A.clk)}</b><span>คลิกรวม</span></div></div>
 <div class="grid two"><div class="card"><h3>Reach และ Engagement rate ต่อโพสต์</h3><canvas id="c1"></canvas></div><div class="card"><h3>สัดส่วนปฏิสัมพันธ์</h3><canvas id="c2"></canvas></div></div>
 <div class="card tw" style="margin-top:14px"><table><tr><th>คอนเทนต์</th><th>ประเภท</th><th>แพลตฟอร์ม</th><th>วันที่</th><th>Reach</th><th>ไลก์</th><th>คอมเมนต์</th><th>แชร์</th><th>คลิก</th><th>Eng.</th><th></th></tr>
 ${[...E].sort((a,b)=>(b.c.date||'').localeCompare(a.c.date||'')).map(e=>`<tr><td>${esc(e.c.title)}</td><td>${tyName(e.c.type)||'-'}</td><td><span class="pic">${ic(e.pf,18)}</span> ${e.pf}</td><td>${e.c.date||'-'}</td><td>${fmt(num(e.s.reach))}</td><td>${fmt(num(e.s.likes))}</td><td>${fmt(num(e.s.cmt))}</td><td>${fmt(num(e.s.shr))}</td><td>${fmt(num(e.s.clk))}</td><td><b>${rateOf(e.s).toFixed(1)}%</b></td><td><button class="btn sm ghost" onclick="fsel=${e.c.id};render();scrollTo(0,0)">แก้ไขผล</button></td></tr>`).join('')||'<tr><td colspan=11>ยังไม่มีผลตอบรับตามตัวกรองนี้</td></tr>'}</table></div>`}
window.after_feedback=()=>{if(fsel)drawFb();const E=entries(pfv,tpv),A=agg(E);
 charts.push(new Chart($('#c1'),{type:'bar',data:{labels:E.map(e=>short(e.c.title)+(pfv==='all'?' ('+e.pf+')':'')),datasets:[{label:'Reach',data:E.map(e=>num(e.s.reach)),backgroundColor:'#FFCC00',borderRadius:6,yAxisID:'y'},{type:'line',label:'Engagement rate %',data:E.map(e=>+rateOf(e.s).toFixed(2)),borderColor:'#F94D12',backgroundColor:'#F94D12',tension:.3,yAxisID:'y1'}]},options:{scales:{y:{beginAtZero:true},y1:{position:'right',beginAtZero:true,grid:{display:false}}}}}));
 charts.push(new Chart($('#c2'),{type:'doughnut',data:{labels:['ไลก์','คอมเมนต์','แชร์'],datasets:[{data:[A.likes,A.cmt,A.shr],backgroundColor:['#FFCC00','#ff8a3d','#F94D12']}]}}))};

/* ============ ข้อมูลเชิงลึก (รวมสถานะคอนเทนต์และผลแยกประเภท) ============ */
function weekdays(E){const w=[...Array(7)].map(()=>({reach:0,eng:0}));E.forEach(e=>{if(!e.c.date)return;const d=new Date(e.c.date).getDay();w[d].reach+=num(e.s.reach);w[d].eng+=engOf(e.s)});return w}
const byType=()=>CTY.map(([k,l])=>[l,agg(entries(pfv,'all').filter(e=>e.c.type===k))]);
function chartPlatform(id){const A=PF.map(p=>agg(entries(p,tpv)));
 charts.push(new Chart($('#'+id),{type:'bar',data:{labels:PF,datasets:[{label:'Reach',data:A.map(a=>a.reach),backgroundColor:'#FFCC00',borderRadius:6},{label:'ปฏิสัมพันธ์ (ไลก์+คอมเมนต์+แชร์)',data:A.map(a=>a.eng),backgroundColor:'#F94D12',borderRadius:6}]},options:{scales:{y:{beginAtZero:true}}}}))}
function ins(){
 const E=entries(pfv,tpv),A=agg(E),out=[],nm=pfv==='all'?'ทุกแพลตฟอร์ม':pfv;
 if(E.length){
  if(pfv==='all'){const by=PF.map(p=>[p,agg(entries(p,tpv))]).filter(x=>x[1].reach);
   if(by.length>1){const r=[...by].sort((a,b)=>b[1].rate-a[1].rate),c=[...by].sort((a,b)=>b[1].reach-a[1].reach);
    out.push(`คนมีส่วนร่วมสูงสุดบน <b>${r[0][0]}</b> (${r[0][1].rate.toFixed(1)}%) ส่วน <b>${c[0][0]}</b> เข้าถึงคนได้มากที่สุด (${fmt(c[0][1].reach)} คน)`)}}
  const bt=byType().filter(x=>x[1].reach);
  if(bt.length){const r=[...bt].sort((a,b)=>b[1].rate-a[1].rate),f=[...bt].sort((a,b)=>b[1].reach-a[1].reach);
   out.push(`ประเภทที่คนมีส่วนร่วมสูงสุดคือ <b>${r[0][0]}</b> (${r[0][1].rate.toFixed(1)}%)${bt.length>1?` ต่ำสุดคือ ${r.at(-1)[0]} (${r.at(-1)[1].rate.toFixed(1)}%)`:''} และประเภทที่เข้าถึงคนรวมมากที่สุดคือ <b>${f[0][0]}</b> (${fmt(f[0][1].reach)} คน)`)}
  const best=E.filter(e=>num(e.s.reach)).sort((a,b)=>rateOf(b.s)-rateOf(a.s))[0];
  if(best)out.push(`คอนเทนต์ที่คนมีส่วนร่วมสูงสุดคือ <b>${esc(best.c.title)}</b> บน ${best.pf} (${rateOf(best.s).toFixed(1)}%)`);
  const bd=weekdays(E).map((w,i)=>[i,w.reach?w.eng/w.reach*100:0,w.reach]).filter(x=>x[2]).sort((a,b)=>b[1]-a[1])[0];
  if(bd)out.push(`วันที่โพสต์แล้วได้ผลดีที่สุดคือ <b>วัน${DW[bd[0]]}</b> (Engagement rate ${bd[1].toFixed(1)}%)`);
  out.push(`Reach รวม ${fmt(A.reach)} คน คลิกรวม ${fmt(A.clk)} ครั้ง (CTR ${A.reach?(A.clk/A.reach*100).toFixed(1):0}%)`);
  const k=[['ไลก์',A.likes],['คอมเมนต์',A.cmt],['แชร์',A.shr]].sort((a,b)=>b[1]-a[1]);
  if(A.eng)out.push(`ปฏิสัมพันธ์ส่วนใหญ่มาจาก<b>${k[0][0]}</b> (${Math.round(k[0][1]/A.eng*100)}%) ส่วนแชร์คิดเป็น ${Math.round(A.shr/A.eng*100)}%`);
 }else out.push(`ยังไม่มีผลตอบรับของ ${nm} ไปที่เมนู "ผลตอบรับ" แล้วเลือกโปรเจกต์ที่โพสต์แล้วเพื่อกรอกตัวเลข`);
 const C=S.contents,T=S.tasks,done=T.filter(t=>t.status==='done').length;
 out.push(`คอนเทนต์ทั้งหมด ${C.length} ชิ้น ยังไม่ระบุประเภท ${C.filter(c=>!c.type).length} ชิ้น และยังไม่กำหนดวันโพสต์ ${C.filter(c=>!c.date&&c.status!=='posted').length} ชิ้น`);
 out.push(`ทีมทำงานเสร็จ <b>${T.length?Math.round(done/T.length*100):0}%</b> (${done}/${T.length} งาน) เลยกำหนด ${T.filter(late).length} งาน`);
 return head('ข้อมูลเชิงลึก','สรุปอัตโนมัติจากผลตอบรับ เลือกดูทีละแพลตฟอร์มหรือประเภทได้')+pfTabs()+out.map(o=>`<div class="ins">${o}</div>`).join('')+
 `<div class="grid two" style="margin-top:14px"><div class="card"><h3>เปรียบเทียบแต่ละแพลตฟอร์ม</h3><canvas id="c1"></canvas></div><div class="card"><h3>Engagement rate แยกตามวันที่โพสต์ (${nm})</h3><canvas id="c2"></canvas></div></div>
 <div class="grid two" style="margin-top:14px"><div class="card"><h3>Engagement rate แยกตามประเภทคอนเทนต์ (${nm})</h3><canvas id="c3"></canvas></div></div>`}
window.after_ins=()=>{chartPlatform('c1');
 const w=weekdays(entries(pfv,tpv));
 charts.push(new Chart($('#c2'),{type:'bar',data:{labels:DW,datasets:[{label:'Engagement rate %',data:w.map(x=>x.reach?+(x.eng/x.reach*100).toFixed(2):0),backgroundColor:'#F94D12',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
 const bt=byType();
 charts.push(new Chart($('#c3'),{type:'bar',data:{labels:bt.map(x=>x[0]),datasets:[{label:'Engagement rate %',data:bt.map(x=>+x[1].rate.toFixed(2)),backgroundColor:'#F94D12',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
};

 <div class="mets"><div><b>${fmt(a.reach)}</b><span>Reach</span></div><div><b>${fmt(a.eng)}</b><span>ปฏิสัมพันธ์</span></div><div><b>${a.rate.toFixed(1)}%</b><span>Eng. rate</span></div></div>

 '<div class="card"><p class="sub" style="margin:0">ยังไม่มีข้อมูลให้จัดอันดับ กรอกผลตอบรับที่เมนู "ผลตอบรับ" อย่างน้อยหนึ่งโปรเจกต์ก่อน</p></div>')}

/* ============ บัญชีผู้ใช้ (Supabase Auth) ============ */
function setMsg(m,ok){const e=$('#a_m');e.textContent=m;e.className=ok?'ok':''}
function authUI(mode,msg='',ok=false){
 const A=$('#auth');A.style.display='flex';
 if(!configured){A.innerHTML=`<div class="authbox"><h1>ยังไม่ได้เชื่อมต่อ Supabase</h1><p class="sub">เปิดไฟล์ index.html แล้วใส่ SUPABASE_URL และ SUPABASE_KEY ที่ส่วนบนของสคริปต์ จากนั้นรันไฟล์ schema.sql ใน SQL Editor ของ Supabase</p></div>`;return}
 const reg=mode==='reg';
 A.innerHTML=`<div class="authbox">${logoHTML(46,'#FFCC00')}

 <div class="tabs"><button class="chip ${reg?'':'on'}" onclick="authUI('login')">เข้าสู่ระบบ</button><button class="chip ${reg?'on':''}" onclick="authUI('reg')">สมัครใช้งาน</button></div>
 <div class="grid" style="gap:10px">${reg?'<div><label>ชื่อที่แสดง</label><input id="a_n" autocomplete="name"></div>':''}
 <div><label>อีเมล</label><input id="a_e" type="email" autocomplete="username"></div>
 <div><label>รหัสผ่าน${reg?' (อย่างน้อย 6 ตัวอักษร)':''}</label><input id="a_p" type="password" autocomplete="${reg?'new-password':'current-password'}"></div>

 <p id="a_m" class="${ok?'ok':''}" style="color:#b02a00;margin:0;min-height:20px">${msg}</p>
 <button class="btn" id="a_go" onclick="${reg?'doReg()':'doLogin()'}">${reg?'สมัครใช้งาน':'เข้าสู่ระบบ'}</button>
 ${reg?'':'<button class="link" onclick="forgot()">ลืมรหัสผ่าน</button>'}</div></div>`;
 A.onkeydown=e=>{if(e.key==='Enter')$('#a_go').click()};($('#a_n')||$('#a_e')).focus()}
async function withBusy(fn){const b=$('#a_go');b.disabled=true;try{await fn()}finally{b.disabled=false}}
function doReg(){withBusy(async()=>{
 const n=$('#a_n').value.trim(),e=$('#a_e').value.trim().toLowerCase(),p=$('#a_p').value,p2=$('#a_p2').value;
 if(!n||!e)return setMsg('กรอกชื่อและอีเมลให้ครบ');
 if(!/^\S+@\S+\.\S+$/.test(e))return setMsg('รูปแบบอีเมลไม่ถูกต้อง');
 if(p.length<6)return setMsg('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร');
 if(p!==p2)return setMsg('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
 const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n}}});
 if(error)return setMsg('สมัครไม่สำเร็จ: '+error.message);
 if(data.session)return enter(true);
 authUI('login','สมัครสำเร็จ หากมีอีเมลยืนยัน ให้กดลิงก์ในอีเมลก่อน แล้วรอแอดมินอนุมัติ',true)})}
function doLogin(){withBusy(async()=>{
 const e=$('#a_e').value.trim().toLowerCase(),p=$('#a_p').value;
 const {error}=await sb.auth.signInWithPassword({email:e,password:p});
 if(error)return setMsg(/confirm/i.test(error.message)?'กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ':'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
 await enter()})}
async function forgot(){const e=$('#a_e').value.trim().toLowerCase();if(!e)return setMsg('กรอกอีเมลก่อน แล้วกด "ลืมรหัสผ่าน"');
 const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});
 setMsg(r.error?'ส่งอีเมลไม่สำเร็จ: '+r.error.message:'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว',!r.error)}
async function newPw(){const p=prompt('ตั้งรหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)');if(!p||p.length<6)return toast('รหัสผ่านสั้นเกินไป ลองขอลิงก์ใหม่');
 const r=await sb.auth.updateUser({password:p});toast(r.error?'เปลี่ยนรหัสผ่านไม่สำเร็จ':'เปลี่ยนรหัสผ่านแล้ว')}
async function enter(fromReg){
 const {data:{session}}=await sb.auth.getSession();if(!session)return authUI('login');
 const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error||!p){await sb.auth.signOut();return authUI('login','ไม่พบข้อมูลโปรไฟล์ ลองใหม่อีกครั้ง')}
 if(p.status!=='active'){await sb.auth.signOut();
  return authUI('login',p.status==='pending'?(fromReg?'สมัครสำเร็จ ':'')+'บัญชีรอแอดมินอนุมัติ ระบบจะให้เข้าใช้งานได้หลังอนุมัติ':'บัญชีนี้ถูกระงับ กรุณาติดต่อแอดมิน',p.status==='pending'&&!!fromReg)}
 ME=p;start()}
function logout(){sb.auth.signOut()}
async function start(){
 $('#auth').style.display='none';
 $('#navAdmin').style.display=isAdmin()?'':'none';
 $('#ubox').innerHTML=`<b>${esc(ME.name)}</b><span>${isAdmin()?'แอดมิน':'สมาชิก'}</span><br><button class="btn sm ghost" style="margin-top:8px" onclick="logout()">ออกจากระบบ</button>`;
 $('#app').innerHTML='<p class="sub">กำลังโหลดข้อมูล...</p>';
 await loadAll();pendBadge();
 document.querySelectorAll('aside .nav').forEach(x=>x.classList.toggle('on',x.dataset.v===view));render();
 if(!chan)chan=sb.channel('team-sync').on('postgres_changes',{event:'*',schema:'public'},onChange).subscribe()}
$('#brandLogo').innerHTML=logoHTML(42,'#fff');
if(LOGO_URL){const l=document.querySelector('link[rel=icon]');if(l)l.href=LOGO_URL}
(async function boot(){
 if(!configured)return authUI('login');
 sb.auth.onAuthStateChange(ev=>{
  if(ev==='PASSWORD_RECOVERY')setTimeout(newPw,300);
  if(ev==='SIGNED_OUT'){ME=null;S={contents:[],tasks:[]};PR=[];if(chan){sb.removeChannel(chan);chan=null}view='dash';$('#app').innerHTML='';authUI('login')}});
 const {data:{session}}=await sb.auth.getSession();
 session?enter():authUI('login')})();
</script>
</body>
</html>
